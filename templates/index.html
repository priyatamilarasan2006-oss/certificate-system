<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Certificate Verification System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">🎓 Certificate System</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin') }}">Admin</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Hero Section -->
<div class="container text-center mt-5">
    <h1 class="display-5 fw-bold">Welcome to Certificate Verification</h1>
    <p class="lead">Verify your certificate authenticity instantly using Certificate ID or QR Code.</p>
</div>

<!-- Verification Form -->
<div class="container mt-4">
    <div class="card shadow-lg">
        <div class="card-header bg-success text-white">
            🔍 Verify Certificate
        </div>
        <div class="card-body">
            <form action="{{ url_for('verify') }}" method="get">
                <div class="input-group">
                    <input type="text" name="certificate_id" placeholder="Enter Certificate ID" class="form-control" required>
                    <button class="btn btn-success" type="submit">Verify</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center mt-5 py-3">
    © 2026 Ananda College | Powered by Flask + Bootstrap
</footer>

</body>
</html>
