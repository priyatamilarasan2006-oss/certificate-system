<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Certificate</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-lg">
        <div class="card-header bg-warning text-dark">
            ✏️ Edit Certificate - {{ certificate.certificate_id }}
        </div>
        <div class="card-body">
            <form method="post">
                <div class="mb-3">
                    <label class="form-label">Student Name</label>
                    <input type="text" name="student_name" value="{{ certificate.student_name }}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Course</label>
                    <input type="text" name="course" value="{{ certificate.course }}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Issue Date</label>
                    <input type="date" name="issue_date" value="{{ certificate.issue_date }}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Institution</label>
                    <input type="text" name="institution" value="{{ certificate.institution }}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <input type="text" name="status" value="{{ certificate.status }}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" value="{{ certificate.email }}" class="form-control">
                </div>
                <button type="submit" class="btn btn-success">💾 Save Changes</button>
                <a href="{{ url_for('admin') }}" class="btn btn-secondary">⬅ Back</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
